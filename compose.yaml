services:
  # ==========================
  # POSTGRESQL
  # ==========================
  postgres:
    image: postgres:16.15-alpine3.24

    env_file:
      - .env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  # ==========================
  # BACKEND - FASTAPI + RAG
  # ==========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: rag-backend:dev

    env_file:
      - .env

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/scripts:/app/scripts

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    restart: unless-stopped

  # ==========================
  # FRONTEND - NEXT.JS
  # ==========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: rag-frontend:dev

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8000

    depends_on:
      - backend

    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0

    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next: